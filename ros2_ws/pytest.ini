[pytest]
# The two packages are ament_python, so their sources are not on sys.path
# until `colcon build` + `source install/setup.bash`. The unit tests are
# pure math (no ROS), so make them runnable straight from a fresh clone:
#     cd ros2_ws && python3 -m pytest -q
pythonpath =
    src/boids_swarm
    src/boids_turtlesim
testpaths =
    src/boids_swarm/test
    src/boids_turtlesim/test
markers =
    slow: long ROS integration test (Nav2 warm-up)
